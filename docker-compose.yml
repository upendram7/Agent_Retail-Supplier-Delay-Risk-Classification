version: '3.9'
services:
  backend:
    build:
      context: ./backend
    container_name: supplier-risk-backend
    ports:
      - '8000:8000'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - APP_ENV=local
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: supplier-risk-frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
